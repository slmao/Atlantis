// Plan 0047 P19 (ADR-0098 D2/D3): the default scene's closure catalog,
// written by the Windows build (the atlantis_asset_catalog target) at the
// build root -- the catalog, then every artifact and metadata file it lists,
// each at its catalog-relative location, verbatim. The locations are
// relative to the catalog's own directory (the build root), so the packaged
// tree keeps them valid with no rewriting; the runtime half is
// extractCatalogClosure() (src/runtime/android/asset_extraction.cpp).
def sceneCatalogRelativePath = 'integrated_showcase_demo.catalog.txt'

// Plan 0034 Milestone 4/5 (ADR-0078/ADR-0080): copies every named asset
// verbatim, then the scene closure catalog and every file it lists --
// discovered from the catalog's own content, not a second hardcoded list, so
// a scene's dependency set can change without this task needing an update.
tasks.register('packageAtlantisAssets') {
  def assetsDir = file("${projectDir}/src/main/assets")
  inputs.dir(atlantisBuildDir)
  outputs.dir(assetsDir)

  doLast {
    if (!atlantisBuildDir.isDirectory()) {
      throw new GradleException(
          "atlantisBuildDir (${atlantisBuildDir}) does not exist -- run the Windows build first " +
          "(cmake -S . -B build && cmake --build build --config Debug), per CLAUDE.md, or pass " +
          "-PatlantisBuildDir=<path> pointing at an existing build tree.")
    }

    namedAssetRelativePaths.each { relativePath ->
      def source = new File(atlantisBuildDir, relativePath)
      if (!source.isFile()) {
        throw new GradleException(
            "Expected Windows-build artifact not found: ${source} -- the Windows build tree at " +
            "${atlantisBuildDir} does not match this task's own fixed relative-path list " +
            "(android/app/build.gradle); rebuild Windows first, or this list is stale.")
      }
      def destination = new File(assetsDir, relativePath)
      destination.parentFile.mkdirs()
      destination.bytes = source.bytes
    }

    def catalogSource = new File(atlantisBuildDir, sceneCatalogRelativePath)
    if (!catalogSource.isFile()) {
      throw new GradleException("Expected scene closure catalog not found: ${catalogSource}")
    }
    def listedRelativePaths = [] as LinkedHashSet
    catalogSource.readLines().findAll { it.startsWith('record: ') }.each { line ->
      def matcher = (line =~ / artifact=(.+?) metadata=(.+?) artifact_schema=/)
      if (!matcher.find()) {
        throw new GradleException("Malformed catalog record in ${catalogSource}: ${line}")
      }
      listedRelativePaths << matcher.group(1)
      listedRelativePaths << matcher.group(2)
    }
    (listedRelativePaths + [sceneCatalogRelativePath]).each { relativePath ->
      def source = new File(atlantisBuildDir, relativePath)
      if (!source.isFile()) {
        throw new GradleException("Catalog-listed file not found: ${source} (listed by ${catalogSource})")
      }
      def destination = new File(assetsDir, relativePath)
      destination.parentFile.mkdirs()
      destination.bytes = source.bytes
    }
  }
}

tasks.named('preBuild').configure {
  dependsOn 'packageAtlantisAssets'
}

android {
  namespace 'com.atlantis.runtime'
  compileSdk 36
  // Plan 0034 Milestone 4 (ADR-0078): pinned, not left to AGP's own
  // default -- the exact NDK version Milestone 1 established as this
  // Spec's own floor (r29+/LLVM >= 20).
  ndkVersion "29.0.14206865"

  defaultConfig {
    applicationId "com.atlantis.runtime"
    minSdk 29
    targetSdk 36
    versionCode 1
    versionName "0.1"

    ndk {
      abiFilters "arm64-v8a"
    }

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_PLATFORM=android-29", "-DATLANTIS_BUILD_TESTS=OFF", "-DATLANTIS_BUILD_EXAMPLES=OFF"
        targets "atlantis_runtime_android"
      }
    }
  }

  // Plan 0034 Milestone 4 (ADR-0078): points at the repository's
  // existing, unmodified top-level CMakeLists.txt -- Gradle drives the
  // same CMake project every other configuration already uses, never a
  // second, forked build graph.
  externalNativeBuild {
    cmake {
      path "../../CMakeLists.txt"
    }
  }

  buildTypes {
    debug {
      // No production release configuration is authorized by this
      // Spec (Non-Goals) -- debug is this Milestone's only build type.
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
